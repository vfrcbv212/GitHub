name: Windows portable download
on:
  workflow_dispatch:
  push:
    branches: [delivery/windows-0.3]
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and test Windows package
        shell: pwsh
        run: .\scripts\Build-PortableWindows.ps1
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-verification
          path: |
            work/native-windows-tests.*
            work/native-check/*.json
            work/native-check/*.png
            work/windows-release-result.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish ZIP after successful checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseTag = "windows-pilot-$env:GITHUB_RUN_ID"
          $archive = 'work/VolleyVision-0.3-Windows-x64.zip'
          $manifest = 'work/windows-release-result.json'
          gh release view $releaseTag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $releaseTag $archive $manifest --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $releaseTag $archive $manifest --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'VolleyVision 0.3 Windows x64 pilot' --notes-file packaging/windows/RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          $releaseUrl = gh release view $releaseTag --repo $env:GITHUB_REPOSITORY --json url --jq .url
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read release URL' }
          Add-Content $env:GITHUB_STEP_SUMMARY "Download: $releaseUrl"
