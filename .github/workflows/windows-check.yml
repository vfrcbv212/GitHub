name: Windows development verification
on:
  workflow_dispatch:
  push:
    branches: [development/simple-setup]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test and assemble development package
        shell: pwsh
        run: .\scripts\Build-PortableWindows.ps1
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: simple-setup-windows-check
          path: |
            work/native-windows-tests.*
            work/native-check/*.json
            work/native-check/*.png
            work/windows-release-result.json
          if-no-files-found: ignore
          retention-days: 14
