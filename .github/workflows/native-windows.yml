name: Native C++ Windows
on:
  push:
    branches: ['native/0.2']
    paths: ['native/**', '.github/workflows/native-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      QT_VERSION: '6.8.3'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build tools only
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) { throw 'aqt install failed' }
          python -m pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'Build-time Torch install failed' }
          python -m pip install ultralytics==8.4.184 onnx==1.23.2 onnxscript==0.7.2
          if ($LASTEXITCODE -ne 0) { throw 'ONNX export dependencies failed' }
      - name: Qt SDK
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -O "$env:RUNNER_TEMP\Qt" -m qtmultimedia
          if ($LASTEXITCODE -ne 0) { throw 'Qt SDK install failed' }
      - name: Prepare pinned models and native DLLs
        shell: pwsh
        run: |
          python native/tools/prepare_models.py
          if ($LASTEXITCODE -ne 0) { throw 'Model preparation failed' }
          python native/tools/windows_deps.py --out "$env:RUNNER_TEMP\native-deps"
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency preparation failed' }
      - name: Compile C++ and deploy portable folder
        shell: pwsh
        run: |
          ./native/packaging/build-windows.ps1 -QtRoot "$env:RUNNER_TEMP\Qt\$env:QT_VERSION\msvc2022_64" -DependencyRoot "$env:RUNNER_TEMP\native-deps"
      - name: Identity and ball regression checks
        shell: pwsh
        run: |
          ctest --test-dir native-build -C Release -R identity_and_ball --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'C++ core checks failed' }
      - name: Execute packaged native EXE on Windows CPU
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_MEDIA_BACKEND: ffmpeg
          QSG_RHI_BACKEND: software
        run: |
          $folder = (Resolve-Path native-dist/VolleyScope).Path
          $process = Start-Process -FilePath "$folder\VolleyScope.exe" -ArgumentList '--self-test','--models',('"' + "$folder\models" + '"') -Wait -PassThru -RedirectStandardOutput native-selftest-output.log -RedirectStandardError native-selftest-errors.log
          Get-Content native-selftest-output.log
          Get-Content native-selftest-errors.log
          if ($process.ExitCode -ne 0) { throw "Packaged native EXE failed: $($process.ExitCode)" }
      - name: Verify and ZIP
        shell: pwsh
        run: |
          python native/tools/package_windows.py --folder native-dist/VolleyScope --out native-dist/VolleyScope-0.2-Windows-x64.zip | Tee-Object native-package-check.json
          if ($LASTEXITCODE -ne 0) { throw 'Native package integrity failed' }
      - name: Publish experimental download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "native-0.2-$env:GITHUB_RUN_ID"
          gh release create $tag native-dist/VolleyScope-0.2-Windows-x64.zip native-dist/VolleyScope-0.2-Windows-x64.sha256 --target $env:GITHUB_SHA --title 'VolleyScope Native 0.2 — C++ Windows' --prerelease --notes-file native/packaging/RELEASE.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-validation
          path: |
            native-selftest-*.log
            native-package-check.json
            native-build/Testing/Temporary/LastTest.log
