[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "volleyvision-local"
version = "0.3.0"
description = "Локальная разметка и проверяемая аналитика волейбола 6×6"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==1.26.4", "opencv-python-headless==4.11.0.86", "av==19.0.2",
  "PySide6==6.12.0", "openpyxl==3.1.5", "psutil==7.2.2",
  "scipy==1.17.0", "norfair==2.3.0", "imageio-ffmpeg==0.6.0"
]

[project.optional-dependencies]
cv = ["torch==2.13.0", "torchvision==0.28.0", "easyocr==1.7.2"]
dev = ["pytest==9.1.1"]

[project.scripts]
volleyvision = "volleyvision.cli:main"

[tool.setuptools.packages.find]
include = ["volleyvision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
